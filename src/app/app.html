<mat-sidenav-container class="app-frame">
  <mat-sidenav
    id="primary-navigation"
    class="app-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="drawerOpen()"
    (closed)="closeMenu()"
  >
    <a class="brand" routerLink="/" aria-label="Gestión académica, ir al inicio" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">G</span>
      <span class="brand-copy">
        <strong>Gestión académica</strong>
        <span>Proyecto final · Prograweb</span>
      </span>
    </a>

    <div class="navigation-caption">MENÚ PRINCIPAL</div>
    <mat-nav-list aria-label="Navegación principal">
      <a
        mat-list-item
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <mat-icon matListItemIcon aria-hidden="true">home</mat-icon>
        <span matListItemTitle>Inicio</span>
      </a>
      <a
        mat-list-item
        routerLink="/estudiantes"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <mat-icon matListItemIcon aria-hidden="true">groups</mat-icon>
        <span matListItemTitle>Estudiantes</span>
      </a>
      <a
        mat-list-item
        routerLink="/inscripciones"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <mat-icon matListItemIcon aria-hidden="true">assignment</mat-icon>
        <span matListItemTitle>Inscripciones</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer">
      <mat-icon aria-hidden="true">school</mat-icon>
      <span>Administración académica</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      @if (isHandset()) {
        <button
          mat-icon-button
          type="button"
          class="menu-button"
          aria-label="Abrir o cerrar navegación"
          aria-controls="primary-navigation"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          <mat-icon aria-hidden="true">menu</mat-icon>
        </button>
      }
      <div class="topbar-title">
        <span class="topbar-kicker">PORTAL ACADÉMICO</span>
        <span class="topbar-heading">Sistema de inscripciones</span>
      </div>
      <span class="topbar-spacer"></span>
      <span class="topbar-status"><span aria-hidden="true"></span> Entorno local</span>
    </mat-toolbar>

    <main class="page-container">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
